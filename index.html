<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO APP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #6EC3F4, #A288E3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        section{
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 50px;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            overflow: hidden;
        }
        .user-input{
            width: 100%;
            display: flex;
            align-items: center;
            background: #e5e4e4;
            border-radius: 50px;
        }
        .user-input input{
            flex: 1;
            border: 0;
            outline: 0;
            font-size: 1rem;
            font-weight: 100;
            padding-left: 1.5rem;
            background: transparent;
        }
        .btn-main{
            background: #fe4848;
            color: white;
            padding: 13px 35px;
            font-size: 18px;
            cursor: pointer;
            border: 0;
            border-radius: 50px;
        }
        h1{
            text-align: left;
            font-size: 40px;
            font-weight: 900;
            width: 100%;
        }
        .tasks{
            width: 100%;
        }
        .task-item{
            list-style: none;
            padding: 10px; 
            background: rgb(207, 202, 202);
            border-radius: 50px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <section>
        <div class="container">
            <h1>TO DO LIST</h1>
            <div class="user-input">
                <input id="input-box" type="text" placeholder="Add your Task">
                <button id="btn-main" type="button" class="btn-main">Add</button>
            </div>
            <div class="tasks">
                <ul id="task-list">
                </ul>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('btn-main')
            .addEventListener('click', function(){
                const input = document.getElementById('input-box').value;
                const li = document.createElement('li');
                li.textContent = input;
                li.classList.add('task-item');
                document.getElementById('task-list').appendChild(li);
                document.getElementById('input-box') = '';
            })
    </script>
</body>
</html>
